plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'host.exp.exponent'
version = '1.0.0'

expoModule {
  canBePublished false
}

android {
  namespace 'expo.modules.focusengine'
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.15.0'
}

